<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password - MXERA</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg:#060606;
        --card:#101010;
        --soft:#181818;
        --border:rgba(255,255,255,0.08);
        --text:#ffffff;
        --muted:#9d9d9d;
        --gold:#d4af37;
        --gold-dark:#8f6a11;
        --gradient:linear-gradient(135deg,#f3d36b 0%,#d4af37 35%,#8f6a11 100%);
      }

      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
      }

      body{
        font-family:'Inter',sans-serif;
        background:var(--bg);
        color:var(--text);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
      }

      .reset-card{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:12px;
        padding:40px;
        max-width:420px;
        width:90%;
        box-shadow:var(--shadow);
      }

      .logo{
        font-size:28px;
        font-weight:800;
        letter-spacing:2px;
        margin-bottom:8px;
        background:var(--gradient);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
      }

      h2{
        font-size:24px;
        font-weight:600;
        margin-bottom:8px;
      }

      .subtitle{
        color:var(--muted);
        font-size:14px;
        margin-bottom:24px;
      }

      .form-group{
        margin-bottom:16px;
      }

      label{
        display:block;
        font-size:13px;
        font-weight:500;
        margin-bottom:6px;
        color:var(--muted);
      }

      input{
        width:100%;
        padding:14px 16px;
        background:var(--soft);
        border:1px solid var(--border);
        border-radius:8px;
        color:var(--text);
        font-size:15px;
        font-family:'Inter',sans-serif;
        transition:border-color 0.2s,box-shadow 0.2s;
      }

      input:focus{
        outline:none;
        border-color:var(--gold);
        box-shadow:0 0 0 3px rgba(212,175,55,0.15);
      }

      input::placeholder{
        color:var(--muted);
      }

      .password-wrapper{
        position:relative;
        display:flex;
        align-items:center;
      }

      .password-wrapper input{
        padding-right:50px;
      }

      .toggle-password{
        position:absolute;
        right:16px;
        background:none;
        border:none;
        cursor:pointer;
        padding:4px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--muted);
        transition:color 0.2s;
      }

      .toggle-password:hover{
        color:var(--gold);
      }

      .toggle-password svg{
        width:20px;
        height:20px;
      }

      .reset-btn{
        width:100%;
        padding:14px;
        background:var(--gradient);
        border:none;
        border-radius:8px;
        color:var(--bg);
        font-size:15px;
        font-weight:600;
        font-family:'Inter',sans-serif;
        cursor:pointer;
        transition:transform 0.2s,box-shadow 0.2s;
        margin-top:8px;
      }

      .reset-btn:hover{
        transform:translateY(-1px);
        box-shadow:0 8px 24px rgba(212,175,55,0.3);
      }

      .reset-btn:active{
        transform:translateY(0);
      }

      .status{
        margin-top:16px;
        padding:12px;
        border-radius:8px;
        font-size:14px;
        text-align:center;
      }

      .status.success{
        background:rgba(34,197,94,0.15);
        color:#22c55e;
        border:1px solid rgba(34,197,94,0.3);
      }

      .status.error{
        background:rgba(239,68,68,0.15);
        color:#ef4444;
        border:1px solid rgba(239,68,68,0.3);
      }

      .back-link{
        display:block;
        text-align:center;
        margin-top:20px;
        color:var(--muted);
        font-size:14px;
        transition:color 0.2s;
      }

      .back-link:hover{
        color:var(--gold);
      }
      @media(max-width:480px){
        .reset-card{
          padding:24px 18px;
        }
        .logo{
          font-size:22px;
        }
        h2{
          font-size:20px;
        }
        .subtitle{
          font-size:13px;
          margin-bottom:18px;
        }
        input{
          padding:12px 14px;
          font-size:14px;
        }
        .password-wrapper input{
          padding-right:44px;
        }
        .reset-btn{
          padding:12px;
          font-size:14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="reset-card">
      <div class="logo">MXERA</div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter a new password below.</p>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="password-wrapper">
          <input id="new-password" type="password" placeholder="Enter new password" />
          <button type="button" class="toggle-password" onclick="togglePassword('new-password', this)">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <div class="password-wrapper">
          <input id="confirm-password" type="password" placeholder="Confirm new password" />
          <button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg class="eye-off-icon" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <button id="reset-btn" class="reset-btn">Reset Password</button>
      <p id="status" class="status" style="display:none;"></p>

      <a href="/" class="back-link">Back to Home</a>
    </div>

    <script>
      const API = (function(){
        const qs = new URLSearchParams(location.search);
        return {
          token: qs.get('token')
        };
      })();

      document.getElementById('reset-btn').addEventListener('click', async () => {
        const pass = document.getElementById('new-password').value;
        const pass2 = document.getElementById('confirm-password').value;
        const status = document.getElementById('status');
        status.style.display = 'none';
        status.className = 'status';

        if (!pass) {
          status.style.display = 'block';
          status.className = 'status error';
          status.textContent = 'Please enter a password';
          return;
        }
        if (pass !== pass2) {
          status.style.display = 'block';
          status.className = 'status error';
          status.textContent = 'Passwords do not match';
          return;
        }
        if (!API.token) {
          status.style.display = 'block';
          status.className = 'status error';
          status.textContent = 'Missing token in URL';
          return;
        }

        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: API.token, password: pass })
          });
          const data = await res.json();
          if (res.ok) {
            status.style.display = 'block';
            status.className = 'status success';
            status.textContent = data.message || 'Password reset successful';
            setTimeout(() => { location.href = '/'; }, 2500);
          } else {
            status.style.display = 'block';
            status.className = 'status error';
            status.textContent = data.error || 'Reset failed';
          }
        } catch (err) {
          status.style.display = 'block';
          status.className = 'status error';
          status.textContent = 'Network error';
        }
      });
    </script>
    <script>
      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input) {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          btn.querySelector('.eye-icon').style.display = isPassword ? 'none' : 'block';
          btn.querySelector('.eye-off-icon').style.display = isPassword ? 'block' : 'none';
        }
      }
    </script>
  </body>
</html>
